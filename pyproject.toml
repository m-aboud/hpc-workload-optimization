[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hpc-workload-optimization"
version = "1.0.0"
description = "HPC workload benchmarking and optimization toolkit for Slurm, Lustre, MPI, IOR, and OSU Micro-Benchmarks."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Mohammad Abood" }]
license = { text = "MIT" }
dependencies = [
  "pandas>=2.0",
  "PyYAML>=6.0",
  "rich>=13.0",
  "tabulate>=0.9"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5.0"
]

[project.scripts]
hpcopt = "hpcopt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
